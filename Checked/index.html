<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checked Property</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <script href="script.js"></script>
    <input type="checkbox" id="checkBox">
    <label for="checkBox">Subscribe</label> <br><br>
    <input type="radio" id="visaBtn" name="cardType">
    <label for="visaBtn">Visa</label> <br>

    <input type="radio" id="masterCardBtn" name="cardType">
    <label for="masterCardBtn">MasterCard</label> <br>
    
    <input type="radio" id="payPalBtn" name="cardType">
    <label for="payPalBtn">PayPal</label> <br><br>

    <button type="submit" id="submitBtn">Submit</button>

    <p id="subscribeResult"></p>
    <p id="paymentResult"></p>
</body>
</html>
